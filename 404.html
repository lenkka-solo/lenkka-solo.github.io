<style>
:root{--bg:#FAFCFF;--mist:#EDF3FB;--navy:#173F7C;--cobalt:#1F59BC;--cobalt2:#16469A;--sel:#3B82F6;--muted:#667189;--line:#E0E7F1;--card:#fff;--ink:#0F1B33;
  --serif:'Newsreader',Georgia,serif;--sans:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;--ease:cubic-bezier(.2,.8,.2,1);color-scheme:light}
html[lang=ru]{--serif:'Cormorant','Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100svh;background:linear-gradient(180deg,var(--mist),var(--bg) 60%);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) clamp(16px,3vw,32px) 0;position:relative;z-index:5}
.brand{font:400 26px/1 var(--serif);color:var(--navy);text-decoration:none}
.hd-r{display:flex;gap:8px;align-items:center}
.lang{display:flex;padding:3px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.lang button{border:0;background:none;border-radius:999px;padding:8px 11px;font:500 12px/1 var(--sans);color:var(--muted);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.pill{display:inline-flex;align-items:center;border:0;border-radius:999px;padding:11px 16px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font:500 13px/1 var(--sans);color:var(--ink);text-decoration:none;cursor:pointer;transition:background-color .2s}
.pill:hover{background:var(--mist)}
.px{position:relative;height:clamp(180px,36vh,360px);margin-top:-8px;touch-action:pan-y}
.px canvas{position:absolute;inset:0;width:100%;height:100%}
main{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 16px calc(40px + env(safe-area-inset-bottom,0px))}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sub{margin:4px auto 16px;max-width:30em;color:var(--muted);text-wrap:balance}
.sx{position:relative;display:flex;align-items:center;gap:12px;width:min(580px,100%);height:58px;padding:0 8px 0 16px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px var(--line),0 18px 40px -22px rgba(23,63,124,.35)}
.sx:focus-within{box-shadow:0 0 0 2px var(--sel),0 18px 40px -22px rgba(23,63,124,.35)}
.sx input{flex:1;min-width:0;border:0;outline:0;font:400 16px/1 var(--sans);color:var(--ink);background:none}
.sx input::placeholder{color:#98A2B6}
.go{width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(180deg,var(--cobalt),var(--cobalt2));color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.go:focus-visible,.pill:focus-visible,.cc:focus-visible,.lang button:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.orb{position:relative;width:22px;height:22px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 30%,#fff 0 9%,#B8D2FB 28%,#3B82F6 62%,#1F59BC 100%);box-shadow:0 2px 8px rgba(59,130,246,.45)}
.orb i{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--sel);opacity:0;transition:opacity .3s}
.orb.think{animation:orbP 1s ease-in-out infinite}
.orb.think i{opacity:1;animation:orbit 1.1s linear infinite}
.orb.think i:nth-child(2){animation-delay:-.275s;background:#9DBEF7}.orb.think i:nth-child(3){animation-delay:-.55s}.orb.think i:nth-child(4){animation-delay:-.825s;background:#9DBEF7}
@keyframes orbit{from{transform:rotate(0) translateX(17px)}to{transform:rotate(360deg) translateX(17px)}}
@keyframes orbP{50%{transform:scale(.86)}}
.ans{width:min(580px,100%);margin-top:12px;padding:16px;border-radius:20px;background:#fff;box-shadow:0 0 0 1px var(--line),0 24px 50px -30px rgba(23,63,124,.35);text-align:left;opacity:0;transform:translateY(8px);transition:opacity .45s var(--ease),transform .45s var(--ease)}
.ans[hidden]{display:block!important;visibility:hidden}
.ans.on{opacity:1;transform:none}
.who{display:flex;align-items:center;gap:8px;font:500 13px/1 var(--sans);color:var(--navy)}
.who small{font-weight:400;color:var(--muted)}
.av{width:24px;height:24px;border-radius:50%;background:var(--cobalt);color:#fff;display:grid;place-items:center;font:500 11px/1 var(--sans)}
.ans p{margin:10px 0 12px}
.ans p a{color:var(--cobalt);text-underline-offset:3px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cc{display:block;text-decoration:none;min-width:0}
.cv{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--mist);transition:transform .4s var(--ease)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv span{position:absolute;background:rgba(255,255,255,.78);border-radius:3px}
.cc:hover .cv{transform:translateY(-3px)}
.cc b{display:block;margin-top:8px;font:400 19px/1.05 var(--serif);color:var(--navy)}
.cc small{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.3}
.foot{margin-top:22px;font-size:13px;color:var(--muted)}
.foot a{color:var(--ink);text-underline-offset:3px}
.ec{position:absolute;left:100%;top:6px;margin-left:6px;display:flex;align-items:flex-start;pointer-events:none;animation:fl 3.2s ease-in-out infinite;opacity:0;transition:opacity .5s}
.ec.on{opacity:1}
.ec span{margin:17px 0 0 -4px;padding:5px 9px;border-radius:2px 9px 9px 9px;background:var(--sel);color:#fff;font:500 12px/1 var(--sans);white-space:nowrap}
@keyframes fl{50%{translate:5px -6px}}
@media(max-width:860px){.ec{display:none}}
@media(max-width:540px){.cards{grid-template-columns:1fr;gap:8px}.cc{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}.cc b{margin-top:0}.lang{display:none}}
@media(prefers-reduced-motion:reduce){.orb.think,.orb.think i,.ec{animation:none}.ans,.cv{transition:none}}
</style>
</head>

  </div>
  <section class="ans" id="ans" aria-live="polite" hidden></section>
  <p class="foot" data-t="foot"></p>
</main>

function find(q){
  const words = q.toLowerCase().split(/[^a-zа-яё0-9]+/i).filter(x => x.length > 2);
  return W.filter(vis).map(w => ({w, s:words.reduce((n, x) => n + (w.k.includes(x) || w.id.includes(x) ? 1 : 0), 0)})).filter(x => x.s).sort((a, b) => b.s - a.s).map(x => x.w);
}
let last = null;
function answer(q, auto){
  last = {q, auto};
  let list, text;
  if(auto){ list = find(q.replace(/[\/_-]+/g, ' ')); text = L().miss(esc(q)); }
  else if(/цен|стоим|прайс|сколько|бюджет|price|cost|how much|rate/i.test(q)){ list = W.filter(w => vis(w) && /site|сайт/.test(w.k)); text = L().price; }
  else if(/контакт|связ|телег|telegram|почт|email|mail|написать|contact|hire|нанять|созвон|call/i.test(q)){ list = []; text = L().contact; }
  else if(/кто ты|о себе|обо мне|about|who are|опыт|experience|резюме|cv/i.test(q)){ list = []; text = L().about; }
  else { list = find(q); text = list.length ? L().hit(esc(q)) : L().none(esc(q)); }
  for(const id of DEF){ const w = W.find(x => x.id === id); if(list.length < 3 && !list.includes(w)) list.push(w); }
  list = list.slice(0, 3);
  ans.innerHTML = `<div class="who"><span class="av">${lang === 'ru' ? 'Е' : 'E'}</span>${lang === 'ru' ? 'Елена' : 'Elena'} <small>· ${L().who}</small></div><p>${text}</p><div class="cards">${list.map(card).join('')}</div>`;
}
let busy = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function run(q, auto){
  const my = ++busy;
  ans.classList.remove('on'); orb.classList.add('think');
  await sleep(RM ? 250 : 1000);
  if(my !== busy) return;
  orb.classList.remove('think'); answer(q, auto); ans.hidden = false;
  requestAnimationFrame(() => ans.classList.add('on'));
}
const ask = () => { const q = inp.value.trim(); if(q) run(q.slice(0, 200)); };
$('#go').addEventListener('click', ask);
inp.addEventListener('keydown', e => { if(e.key === 'Enter') ask(); });
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang; try{ localStorage.setItem('lang', lang); }catch(e){}
  applyLang(); if(last) answer(last.q, last.auto);
}));
applyLang();
(async () => {
  await sleep(500);
  let typed = '';
  for(const ch of path){ if(document.activeElement === inp) return; typed += ch; inp.value = typed; await sleep(RM ? 0 : 38 + Math.random()*40); }
  await sleep(250); await run(path, true);
  $('#ec').classList.add('on');
})();

/* pixel 404: scatters under the cursor, reassembles */
(() => {
  const host = $('#px'), cv = document.createElement('canvas'); host.append(cv);
  const g = cv.getContext('2d'), PAL = ['#0E3F90','#1F59BC','#3B82F6','#3B82F6','#9DBEF7'];
  let Wd = 0, H = 0, D = 1, S = 12, P = [], ready = false, raf = 0, still = 0; const m = {x:0, y:0, on:false};
  const build = () => {
    D = Math.min(devicePixelRatio || 1, 2); Wd = host.clientWidth; H = host.clientHeight; if(!Wd || !H) return;
    cv.width = Wd*D; cv.height = H*D; S = Wd < 560 ? 8 : 12;
    const fs = Math.min(Wd*.34, H*.82), o = document.createElement('canvas'); o.width = Wd; o.height = H;
    const x = o.getContext('2d'); x.font = `700 ${fs}px Onest, system-ui, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('404', Wd/2, H*.54);
    const d = x.getImageData(0, 0, Wd, H).data, old = P; P = [];
    for(let y = 0; y + S/2 < H; y += S) for(let xx = 0; xx + S/2 < Wd; xx += S){
      if(d[((y + (S>>1))*Wd + xx + (S>>1))*4 + 3] > 128){
        const q = old[P.length];
        P.push({hx:xx, hy:y, x:q ? q.x : RM ? xx : Math.random()*Wd, y:q ? q.y : RM ? y : Math.random()*H, vx:0, vy:0, c:PAL[Math.random()*PAL.length|0], p:Math.random() < .12, w:Math.random()*6.28});
      }
    }
    ready = true; wake();
  };
  const frame = now => {
    raf = 0; if(!ready) return;
    g.setTransform(D, 0, 0, D, 0, 0); g.clearRect(0, 0, Wd, H);
    const R = S*8; let moving = 0;
    for(const p of P){
      let ax = (p.hx - p.x)*.045, ay = (p.hy - p.y)*.045;
      if(m.on){ const dx = p.x - m.x, dy = p.y - m.y, d2 = dx*dx + dy*dy; if(d2 < R*R){ const dd = Math.sqrt(d2) || 1, f = (1 - dd/R)*3.4; ax += dx/dd*f; ay += dy/dd*f; } }
      p.vx = (p.vx + ax)*.86; p.vy = (p.vy + ay)*.86; p.x += p.vx; p.y += p.vy;
      if(Math.abs(p.vx) + Math.abs(p.vy) > .05) moving++;
      g.globalAlpha = RM ? .9 : .72 + .26*Math.sin(now*.002 + p.w);
      g.fillStyle = g.strokeStyle = p.c;
      if(p.p){ const h = S*.32, cx = p.x + S/2, cy = p.y + S/2; g.lineWidth = 1.5; g.beginPath(); g.moveTo(cx - h, cy); g.lineTo(cx + h, cy); g.moveTo(cx, cy - h); g.lineTo(cx, cy + h); g.stroke(); }
      else g.fillRect(p.x + 1, p.y + 1, S - 2, S - 2);
    }
    still = moving ? 0 : still + 1;
    if(!(RM && still > 2) && !document.hidden) raf = requestAnimationFrame(frame);
  };
  const wake = () => { if(!raf) raf = requestAnimationFrame(frame); };
  document.fonts.load('700 100px Onest').catch(() => {}).then(build);
  new ResizeObserver(() => { if(ready) build(); }).observe(host);
  host.addEventListener('pointermove', e => { const r = host.getBoundingClientRect(); m.x = e.clientX - r.left; m.y = e.clientY - r.top; m.on = true; wake(); });
  host.addEventListener('pointerleave', () => m.on = false);
  host.addEventListener('pointerdown', e => {
    const r = host.getBoundingClientRect(), cx = e.clientX - r.left, cy = e.clientY - r.top;
    P.forEach(p => { const dx = p.x - cx, dy = p.y - cy, dd = Math.hypot(dx, dy) || 1, k = (RM ? 6 : 26)*(1 - Math.min(dd, 500)/500) + Math.random()*4; p.vx += dx/dd*k; p.vy += dy/dd*k; });
    wake();
  });
  document.addEventListener('visibilitychange', wake);
})();
})();

:root{
  --bg:#FAFCFF;--mist:#EDF3FB;--mist2:#DFE9F7;--card:#FFFFFF;
  --ink:#17223B;--navy:#173F7C;--cobalt:#1F59BC;--cobalt2:#0E3F90;--sel:#3B82F6;
  --muted:#667189;--line:#E0E7F1;--sf:#0D2148;--amber:#F5A524;--ok:#1F9D6B;
  --ease:cubic-bezier(.22,1,.36,1);--ease2:cubic-bezier(.65,0,.35,1);
  --serif:'Newsreader',Georgia,'Times New Roman',serif;--sans:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --wrap:1320px;--pad:clamp(18px,4vw,48px);color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1120;--mist:#101B31;--mist2:#16243F;--card:#111B2F;--ink:#E5ECF8;--navy:#C3D6FF;--cobalt:#3F7BE6;--cobalt2:#2A62CC;--sel:#6EA2FF;--muted:#93A0BA;--line:#21304D;--sf:#0B1A38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1120;--mist:#101B31;--mist2:#16243F;--card:#111B2F;--ink:#E5ECF8;--navy:#C3D6FF;--cobalt:#3F7BE6;--cobalt2:#2A62CC;--sel:#6EA2FF;--muted:#93A0BA;--line:#21304D;--sf:#0B1A38;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:clip;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
::selection{background:var(--sel);color:#fff}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* figma-style multiplayer cursor */
@media (hover:hover) and (pointer:fine){html.fc,html.fc *{cursor:none!important}html.fc input,html.fc textarea{cursor:text!important}}
.fcur{position:fixed;left:0;top:0;z-index:500;pointer-events:none;display:flex;align-items:flex-start;opacity:0;transition:opacity .2s}
.fcur.on{opacity:1}
.fcur svg{flex:none;transition:transform .2s var(--ease)}
.fcur.down svg{transform:scale(.82)}
.fcur span{margin:17px 0 0 -4px;padding:5px 9px;border-radius:2px 9px 9px 9px;background:var(--cobalt);color:#fff;font:500 12px/1 var(--sans);white-space:nowrap;transition:background-color .25s,padding .35s var(--ease),transform .35s var(--ease),opacity .2s;transform-origin:0 0;opacity:0;transform:scale(.6)}
.fcur.act span{background:var(--cobalt);padding:7px 12px;transform:scale(1.06);opacity:1}
.fcur path{transition:fill .25s}
.fcur.act path{fill:var(--cobalt)}

/* buttons, pills */
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;font:500 14px/1 var(--sans);text-decoration:none;white-space:nowrap;transition:transform .45s var(--ease),background-color .3s,box-shadow .3s}
.btn-p{background:linear-gradient(180deg,var(--cobalt),var(--cobalt2));color:#fff}
.btn-p:hover{filter:brightness(1.08)}
.btn-g{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn-g:hover{box-shadow:inset 0 0 0 1px var(--navy)}
.btn svg{flex:none;transition:transform .4s var(--ease)}
.btn:hover svg{transform:translate(2px,-2px)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-size:14px;line-height:1;white-space:nowrap;text-decoration:none;box-shadow:inset 0 0 0 1px var(--line);background:var(--card);transition:background-color .3s,color .3s,box-shadow .3s}
.pill:hover{box-shadow:inset 0 0 0 1px var(--navy)}
.pill.on{background:var(--ink);color:var(--bg);box-shadow:none}

/* intro */
.intro{position:fixed;inset:0;z-index:300;background:var(--bg);transition:background-color .8s ease}
.intro.clear{background:transparent;pointer-events:none}
.intro canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .6s ease}
.intro.on canvas{opacity:1}
.intro.fade canvas{opacity:0;transition-duration:.9s}
.i-pill{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 40px));height:64px;display:flex;align-items:center;gap:14px;padding:0 9px 0 22px;border-radius:999px;background:var(--card);box-shadow:0 0 0 1px var(--line),0 30px 80px -30px rgba(23,63,124,.35);z-index:2;box-sizing:border-box}
.i-pill::before{content:'';position:absolute;inset:-10px -8px;border-radius:inherit;z-index:-1;background:conic-gradient(from var(--ga),#6EA2FF,#B9AEFF,#FFC9AE,#9FC2FF,#6EA2FF);filter:blur(22px);opacity:.45;animation:glowR 6s linear infinite}
.i-pill::after{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--card);z-index:-1}
.i-q{font:400 18px/1 var(--sans);color:var(--ink);white-space:pre;display:flex}
.i-q i{font-style:normal;display:inline-block;animation:phIn .5s var(--ease) both}
.i-q.out i{animation:phOut .35s ease both}
.i-caret{width:1.5px;height:22px;background:var(--sel);margin-left:-12px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.i-pill.think .i-caret{opacity:0;animation:none}
.i-go{margin-left:auto;flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--cobalt),var(--cobalt2));color:#fff;transition:transform .4s var(--ease)}
.i-pill.go .i-go{transform:scale(.88)}
.i-cap{position:fixed;left:50%;transform:translateX(-50%);top:calc(50% + 46px);margin:0;padding:7px 12px;border-radius:999px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);white-space:nowrap;text-align:center;font:400 13px/1 var(--sans);letter-spacing:.02em;color:var(--muted);font-variant-numeric:tabular-nums;transition:opacity .4s}
.intro.clear .i-cap{opacity:0}
.i-cap{display:none!important}
.pill-flying .sx-hero{opacity:0!important;transition:none!important}
@media(max-width:700px){.i-pill{height:58px}.i-go{width:42px;height:42px}}
@keyframes rise{to{transform:none}}

/* header */
.hd{position:fixed;top:0;left:0;right:0;z-index:60;padding-top:env(safe-area-inset-top,0px);transition:transform .55s var(--ease),background-color .3s,box-shadow .3s}
.hd.scrolled{background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 1px 0 var(--line)}
.hd.hide{transform:translateY(-110%)}
.hd-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;height:72px}
.hd-nav{display:flex;gap:6px;justify-self:start}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;white-space:nowrap}
.brand b{font:400 24px/1 var(--serif);letter-spacing:-.01em;color:var(--navy)}
.brand span{font-size:14px;color:var(--muted)}
.hd-r{display:flex;align-items:center;gap:8px;justify-self:end}
.lang{display:flex;padding:3px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.lang button{padding:7px 10px;border-radius:999px;font:500 12px/1 var(--sans);color:var(--muted);transition:background-color .3s,color .3s}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.kbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);background:var(--card)}
.kbtn kbd{font:inherit;color:var(--ink)}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:ping 2.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}
.menu-btn{display:none;width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);place-items:center}
.menu-btn i{display:block;width:16px;height:1.5px;background:var(--ink)}
.menu-btn i+i{margin-top:5px}
@media(max-width:1240px){.status{display:none}}
@media(max-width:480px){.hd-r .lang{display:none}}
@media(max-width:1080px){.hd-nav,.kbtn,.hd-r .btn{display:none}.menu-btn{display:grid}.hd-in{grid-template-columns:1fr auto}.brand{justify-self:start}}

/* hero */
.hero{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:140px var(--pad) 110px;background:linear-gradient(180deg,var(--mist) 0%,color-mix(in srgb,var(--mist) 40%,var(--bg)) 60%,var(--bg) 100%);overflow-x:clip;overflow-y:visible}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;opacity:.35;-webkit-mask:radial-gradient(60% 55% at 50% 45%,#000,transparent);mask:radial-gradient(60% 55% at 50% 45%,#000,transparent);pointer-events:none}
.h-title{position:relative;margin:0;font:300 clamp(38px,5.2vw,80px)/1.04 var(--serif);letter-spacing:-.028em;color:var(--navy);font-variation-settings:'opsz' 72}
.h-title .ln{display:block}
@media(min-width:900px){.h-title .ln{white-space:nowrap}}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .05em .14em;margin:0 -.05em -.14em}
.w>span{display:inline-block;transform:translateY(112%);transition:transform 1.1s var(--ease)}
.ready .w>span{transform:none}
.sel{position:relative;display:inline-block;font-style:italic;padding:0 .14em;margin:0 .02em}
.sel-box{position:absolute;inset:.04em -.02em .02em;border:1.5px solid var(--sel);clip-path:inset(0 100% 100% 0);transition:clip-path 1s var(--ease2) 1.05s;pointer-events:none}
.ready .sel-box{clip-path:inset(-60px)}
.sel-box i{position:absolute;width:9px;height:9px;background:var(--card);border:1.5px solid var(--sel);transform:translate(-50%,-50%) scale(0);transition:transform .5s var(--ease) 1.8s}
.ready .sel-box i{transform:translate(-50%,-50%) scale(1)}
.sel-size{position:absolute;left:50%;top:100%;transform:translate(-50%,10px) scale(.6);font:500 11px/1 var(--sans);letter-spacing:0;color:#fff;background:var(--sel);padding:4px 7px;border-radius:5px;opacity:0;transition:opacity .4s 2s,transform .6s var(--ease) 2s;font-style:normal;white-space:nowrap}
.ready .sel-size{opacity:1;transform:translate(-50%,10px)}
.fx-cur{position:absolute;right:-6px;bottom:-14px;display:flex;align-items:flex-start;pointer-events:none;transform:translate(140px,120px);opacity:0;transition:transform 1.4s var(--ease) 2.1s,opacity .4s 2.1s}
.ready .fx-cur{transform:none;opacity:1}
.fx-cur span{margin:18px 0 0 -3px;font:500 13px/1 var(--sans);font-style:normal;letter-spacing:0;color:#fff;background:var(--sel);padding:6px 10px;border-radius:2px 10px 10px 10px}
.h-sub{position:relative;margin:30px auto 0;max-width:36em;font-size:clamp(16px,1.4vw,18px);color:var(--muted);opacity:0;transform:translateY(12px);transition:opacity .8s 1.2s,transform 1s var(--ease) 1.2s}
.ready .h-sub,.ready .sx-hero,.ready .chips{opacity:1;transform:none}
.h-foot{position:absolute;left:var(--pad);right:var(--pad);bottom:30px;display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:var(--muted)}
.scrollcue{display:flex;align-items:center;gap:12px;text-decoration:none}
.scrollcue i{position:relative;width:1px;height:44px;background:var(--line);overflow:hidden}
.scrollcue i::after{content:'';position:absolute;left:0;top:-50%;width:1px;height:50%;background:var(--navy);animation:cue 2s var(--ease2) infinite}
@keyframes cue{to{top:110%}}
/* floating collage */
.fx{position:absolute;pointer-events:none;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.fx-in{opacity:0;transform:translateY(24px) scale(.94);transition:opacity .9s,transform 1.2s var(--ease)}
.ready .fx-in{opacity:1;transform:none}
.fx-card .fx-in{width:var(--fw,240px);padding:8px;border-radius:22px;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 0 1px var(--line),0 30px 60px -30px rgba(23,63,124,.45);rotate:var(--r,0deg);text-align:left;pointer-events:auto;transition:opacity .9s,transform 1.2s var(--ease),rotate .6s var(--ease)}
.fx-card .fx-in:hover{rotate:0deg}
.fx-card .scr{border-radius:15px;overflow:hidden;aspect-ratio:var(--ar,4/3)}
.fx-card b{display:block;margin:10px 6px 2px;font:400 18px/1.1 var(--serif);color:var(--navy)}
.fx-card small{display:block;margin:0 6px 6px;font-size:12px;color:var(--muted)}
.fx-tag .fx-in{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;font:400 italic 17px/1 var(--serif);color:var(--navy);background:var(--card);box-shadow:0 0 0 1px var(--line);rotate:var(--r,0deg)}
.fx-tag .fx-in i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--sel))}
.fx-tool .fx-in{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:14px;background:var(--card);box-shadow:0 0 0 1px var(--line);rotate:-6deg}
.fx-tool b{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink)}
.fx-tool b.on{background:var(--sel);color:#fff}
.fx-pick .fx-in{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;background:var(--card);box-shadow:0 0 0 1px var(--line);rotate:5deg;font:500 11px/1 var(--sans);color:var(--muted);text-align:left}
.fx-pick .strip{display:flex;height:24px;border-radius:7px;overflow:hidden}.fx-pick .strip i{width:24px}
.fx-hi .fx-in{padding:9px 14px;border-radius:16px 16px 16px 4px;background:var(--sel);color:#fff;font:500 14px/1 var(--sans)}
@media(max-width:1180px){.fx-card,.fx-tag,.fx-tool,.fx-pick,.fx-hi{display:none}}
/* tall tablets: four cards in the corners around the centred content */
@media(min-width:761px) and (max-width:1180px) and (min-height:900px){
  #collage .fx-card{display:block}
  #collage .fx-card:nth-child(1){left:4%!important;top:110px!important}
  #collage .fx-card:nth-child(1) .fx-in{--fw:220px!important;--r:-6deg!important}
  #collage .fx-card:nth-child(2){left:5%!important;top:auto!important;bottom:120px}
  #collage .fx-card:nth-child(2) .fx-in{--fw:190px!important;--r:4deg!important}
  #collage .fx-card:nth-child(3){right:5%!important;top:96px!important}
  #collage .fx-card:nth-child(3) .fx-in{--fw:120px!important;--r:7deg!important}
  #collage .fx-card:nth-child(4){right:6%!important;top:auto!important;bottom:110px}
  #collage .fx-card:nth-child(4) .fx-in{--fw:150px!important;--r:-4deg!important}
}
/* phones: a small fan of three project cards above the headline */
@media(max-width:760px){
  .hero{justify-content:flex-start;padding-top:340px}
  #collage .fx-card{display:block}
  #collage .fx-card:nth-child(4){display:none}
  #collage .fx-card:nth-child(1){left:4%!important;top:96px!important;right:auto!important}
  #collage .fx-card:nth-child(1) .fx-in{--fw:clamp(150px,22vw,230px)!important;--r:-7deg!important}
  #collage .fx-card:nth-child(2){left:33%!important;top:150px!important;right:auto!important}

}

/* search */
.sx{position:relative;width:min(700px,100%);margin:36px auto 0;text-align:left;z-index:30}

.sx-box>svg{flex:none;color:var(--muted)}

.sx-group{font-size:12px;color:var(--muted);padding:12px 12px 4px}
.sx-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:12px;text-align:left}
.sx-item.on{background:var(--mist)}
.sx-ic{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:italic 400 17px/1 var(--serif);color:#fff}

.sx-prev{border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}

.sx-prev h4{margin:0;font:400 26px/1.05 var(--serif);letter-spacing:-.01em;color:var(--navy)}

@media(max-width:700px){.sx-pop{grid-template-columns:1fr}.sx-prev{display:none}.sx kbd{display:none}.sx-box{height:58px}.sx-go{width:42px;height:42px}}
.pal{position:fixed;inset:0;z-index:170;display:grid;justify-items:center;align-content:start;padding:calc(env(safe-area-inset-top,0px) + 12vh) 16px 20px;visibility:hidden}

/* covers: placeholder gradient + drawn screen */
.cov{position:relative;overflow:hidden;background:var(--c1);isolation:isolate}

.cov .shot{position:absolute;left:14%;right:14%;top:13%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(10,20,50,.45);transform:rotate(-3deg);transition:transform 1s var(--ease)}
.cov .shot.ph{left:34%;right:34%;top:9%;aspect-ratio:9/18.5;border-radius:18px;border:5px solid #0B1426;transform:rotate(4deg)}

/* marquee */
.mq{position:relative;z-index:1;overflow:hidden;padding:24px 0;border-block:1px solid var(--line);background:var(--bg)}

/* sections */
.sec{padding:clamp(90px,11vw,160px) 0}

.lead{max-width:32em;margin:14px 0 0;color:var(--muted);font-size:17px}
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform 1.1s var(--ease)}
.rv.in{opacity:1;transform:none}
/* word blur-in for headings */
.h2.rv{opacity:1;transform:none}
.wd{display:inline-block;transition:opacity .8s var(--ease),filter .9s var(--ease),transform 1s var(--ease);transition-delay:calc(var(--i)*65ms)}
.rv:not(.in) .wd{opacity:0;filter:blur(10px);transform:translateY(.28em)}
/* hero: pixel trail + soft aura */
.h-px{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.px-all{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;pointer-events:none}
.h-aura{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.h-aura i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.h-aura i:nth-child(1){width:46vw;height:46vw;left:-8vw;top:-6vw;background:#C9DCFB;animation:aura1 22s ease-in-out infinite alternate}
.h-aura i:nth-child(2){width:36vw;height:36vw;right:-6vw;top:22%;background:#FFE7C2;opacity:.45;animation:aura2 26s ease-in-out infinite alternate}
.h-aura i:nth-child(3){width:30vw;height:30vw;left:30%;bottom:-14vw;background:#D9E6FF;animation:aura1 30s ease-in-out infinite alternate-reverse}
@keyframes aura1{to{transform:translate(9vw,6vw) scale(1.12)}}
@keyframes aura2{to{transform:translate(-8vw,-5vw) scale(.92)}}
@media (prefers-reduced-motion:reduce){.h-aura i{animation:none}.wd{transition:none}.rv:not(.in) .wd{opacity:1;filter:none;transform:none}}

/* work */
.tabs{display:flex;gap:6px;flex-wrap:wrap}

.tab{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font-size:14px;line-height:1;box-shadow:inset 0 0 0 1px var(--line);background:var(--card);transition:background-color .35s,color .35s}

.sfb p{margin:0;font-size:18px;color:rgba(231,238,250,.78);max-width:30em}

.orbit{position:relative;width:min(560px,100%);aspect-ratio:1;justify-self:center}
.ring{position:absolute;container-type:size;border-radius:50%;border:1px dashed color-mix(in srgb,var(--navy) 30%,transparent);animation:spin var(--t,60s) linear infinite}
.ring.r1{inset:20%;--t:44s}.ring.r2{inset:2%;--t:80s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.ring .t{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) translateY(-50cqw)}
.ring .t>span{position:absolute;left:0;top:0;transform:translate(-50%,-50%) rotate(calc(-1 * var(--a)));}
.ring .t>span>button{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;white-space:nowrap;animation:spin var(--t) linear infinite reverse;transition:background-color .3s,color .3s}
.ring.r2 .t>span>button{animation-direction:normal}
.ring .t>span>button i{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font:600 11px/1 var(--sans);color:#fff}
.ring .t>span>button.on,.ring .t>span>button:hover{background:var(--ink);color:var(--bg)}
.orbit:hover .ring{animation-play-state:paused}.orbit:hover .ring .t>span>button{animation-play-state:paused}
.core{position:absolute;inset:36%;border-radius:50%;display:grid;place-items:center;text-align:center;padding:14px;background:var(--navy);color:var(--bg)}
.core b{display:block;font:300 italic 26px/1.05 var(--serif)}
.core small{display:block;margin-top:6px;font-size:12px;line-height:1.35;opacity:.8;max-width:13em}
.ai-txt h3{margin:30px 0 8px;font:400 26px/1.1 var(--serif);color:var(--navy)}
.ai-list{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--line)}
.ai-list li{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);transition:background-color .3s}
.ai-list li.on{background:var(--mist)}
.ai-list b{font-weight:500;padding-left:8px}
.ai-list span{color:var(--muted)}
@media(max-width:900px){.ai{grid-template-columns:1fr}.ai-list li{grid-template-columns:110px 1fr}}

/* footer */
.ft{position:relative;padding:clamp(90px,12vw,150px) 0 calc(28px + env(safe-area-inset-bottom,0px));overflow:clip}
.wm{display:flex;justify-content:center;align-items:center;margin:0;font:200 min(12.4vw,200px)/.9 var(--serif);letter-spacing:-.045em;color:var(--ink);user-select:none;-webkit-user-select:none;white-space:nowrap}
.wm span{display:inline-block;font-variation-settings:'wght' var(--w,260);transition:font-variation-settings .35s ease-out,transform 1s var(--ease),opacity 1s;transform:translateY(40%);opacity:0}
.wm.in span{transform:none;opacity:1}
.wm .it{font-style:italic}
.wm .sp{width:.2em;flex:none}
.wm .face{width:.95em;height:.66em;flex:none;margin:0 .08em;border-radius:.12em;overflow:hidden;background:linear-gradient(160deg,var(--mist2),var(--mist));display:grid;place-items:center;letter-spacing:0;rotate:-4deg;transition:rotate .6s var(--ease),transform 1s var(--ease),opacity 1s}
.wm .face:hover{rotate:3deg}
.wm .face small{font:500 13px/1.2 var(--sans);color:var(--muted)}
.ft-cta{text-align:center;margin-top:34px}
.ft-cta p{font-size:18px;margin:0 0 22px}
.ft-cta .row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.ft-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:clamp(60px,8vw,100px)}
.ft-bar .soc{display:flex;gap:8px;flex-wrap:wrap}
.ft-bar p{margin:0;color:var(--muted);font-size:14px}

/* popups (stacked cards) */
.pop{position:fixed;inset:0;z-index:150;overflow:auto;visibility:hidden;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);overscroll-behavior:contain}
.pop.open{visibility:visible}
.pop-bg{position:fixed;inset:0;background:color-mix(in srgb,#0A1430 45%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity .4s}
.pop.open .pop-bg{opacity:1}
.stack{position:relative;width:min(1080px,100%);margin:0 auto;display:flex;flex-direction:column;gap:8px}
.pk{background:var(--card);border-radius:24px;opacity:0;transform:translateY(-36px) scale(.97);transition:transform .75s var(--ease),opacity .45s;transition-delay:calc(var(--i,0) * 70ms)}
.pop.open .pk{opacity:1;transform:none}
.pop.closing .pk{transition-delay:0s}
.pbar{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 22px;border-radius:999px}
.pbar .ttl{font-size:15px;margin-right:auto}
.pbar .x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--cobalt),var(--cobalt2));color:#fff;transition:transform .45s var(--ease)}
.pbar .x:hover{transform:rotate(90deg)}
.ptabs{display:flex;gap:4px}
.ptabs button{padding:9px 14px;border-radius:999px;font-size:13px;line-height:1;box-shadow:inset 0 0 0 1px var(--line)}
.ptabs button[aria-selected=true]{background:var(--ink);color:var(--bg);box-shadow:none}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px;border-radius:999px}
.pfoot div{display:flex;gap:6px;flex-wrap:wrap}
.pfoot .pill{padding:8px 13px;font-size:13px}
.pbody{padding:clamp(22px,3vw,36px)}
.pbody .big{margin:0;font:300 clamp(30px,3.4vw,50px)/1.08 var(--serif);letter-spacing:-.02em;color:var(--navy)}
.pbody .big em{font-style:italic}
.pgrid{display:grid;gap:8px}
.about-top{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:stretch}
.about-top p.t{color:var(--muted);margin:22px 0 0;max-width:34em}
.photo{border-radius:18px;min-height:260px;background:linear-gradient(160deg,var(--mist2),var(--mist));display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center}
.photo b{display:block;font:300 italic 56px/1 var(--serif);color:var(--navy)}
.lbl{display:inline-block;padding:6px 11px;border-radius:999px;font-size:12px;line-height:1;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:16px}
.life{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.life>div{aspect-ratio:3/4;border-radius:16px;background:var(--mist);display:grid;place-items:center;color:var(--muted);font-size:12px;transition:transform .6s var(--ease)}
.life>div:hover{transform:rotate(-2deg) scale(1.02)}
.life .me{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;padding:10px;gap:8px;place-items:stretch}
.life .me .photo{flex:1;min-height:0}
.life .me b{font:400 20px/1 var(--serif);color:var(--navy);text-align:center}
.life .me small{text-align:center;color:var(--ok)}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cols3>div{padding:22px;border-radius:20px;background:var(--mist)}
.cols3 ul{list-style:none;margin:0;padding:0}
.cols3 li{padding:3px 0}
.xp{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.xp>li{border-bottom:1px solid var(--line)}
.xp button{display:grid;grid-template-columns:170px 1fr auto;gap:20px;align-items:baseline;width:100%;padding:18px 0;text-align:left}
.xp .yr{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.xp .ro{font:400 24px/1.15 var(--serif);color:var(--navy)}
.xp .ro small{display:block;font:400 15px/1.4 var(--sans);color:var(--muted);margin-top:4px}
.xp .pl{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);transition:transform .5s var(--ease)}
.xp li.open .pl{transform:rotate(45deg)}
.xp .det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--ease)}
.xp li.open .det{grid-template-rows:1fr}
.xp .det>div{overflow:hidden}
.xp ul{margin:0 0 20px 190px;padding:0 0 0 18px;color:var(--muted)}
.edu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:24px}
.edu div{padding:18px;border-radius:18px;background:var(--mist)}
.edu b{display:block;font:400 19px/1.15 var(--serif);color:var(--navy);margin-bottom:4px}
.edu span{font-size:13px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps li{counter-increment:s;padding:20px;border-radius:20px;background:var(--mist)}
.steps li::before{content:counter(s,decimal-leading-zero);display:block;font:400 italic 30px/1 var(--serif);color:var(--sel);margin-bottom:26px}
.steps b{display:block;font-weight:500;margin-bottom:4px}
.steps span{font-size:14px;color:var(--muted)}
.prin{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.prin div{padding:22px;border-radius:20px;box-shadow:inset 0 0 0 1px var(--line)}
.prin b{display:block;font:400 22px/1.15 var(--serif);color:var(--navy);margin-bottom:6px}
.prin span{color:var(--muted);font-size:15px}
.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.prices div{padding:22px;border-radius:20px;background:var(--sf);color:#fff;display:flex;flex-direction:column;gap:10px;min-height:190px}
.prices b{font:400 22px/1.15 var(--serif)}
.prices span{color:rgba(231,238,250,.7);font-size:14px}
.prices strong{margin-top:auto;font:300 40px/1 var(--serif);color:#FFD27A}
.prices strong small{font:400 14px var(--sans);color:rgba(231,238,250,.7);margin-right:6px}
.masonry{columns:4 200px;column-gap:8px}
.masonry>div{break-inside:avoid;margin-bottom:8px;border-radius:16px;overflow:hidden;position:relative;transition:transform .6s var(--ease)}
.masonry>div:hover{transform:scale(.98)}
.masonry .cap{position:absolute;left:10px;bottom:10px;padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.85);color:#17223B;font-size:12px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .4s var(--ease)}
.masonry>div:hover .cap{opacity:1;transform:none}
.peek{display:grid;grid-template-columns:1.6fr .9fr;gap:8px}
.peek .info{padding:24px;border-radius:24px;background:var(--card);display:flex;flex-direction:column;gap:14px}
.peek .info h3{margin:0;font:300 44px/1 var(--serif);letter-spacing:-.02em;color:var(--navy)}
.peek .meta2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 0;border-block:1px solid var(--line)}
.peek .meta2 span{display:block;font-size:12px;color:var(--muted)}
.peek .info .acts{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.peek .pins{padding:10px;border-radius:24px;background:var(--card)}
.form{display:grid;grid-template-columns:1.3fr .7fr;gap:8px}
.form .fl{display:flex;flex-direction:column;gap:18px}
.form .grp b{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-bottom:8px}
.form .opts{display:flex;flex-wrap:wrap;gap:6px}
.form .opts button{padding:9px 14px;border-radius:999px;font-size:14px;line-height:1;box-shadow:inset 0 0 0 1px var(--line);transition:background-color .3s,color .3s}
.form .opts button[aria-pressed=true]{background:var(--ink);color:var(--bg);box-shadow:none}
.form textarea,.form input{width:100%;border:0;border-radius:16px;padding:14px 16px;background:var(--mist);font:400 15px/1.5 var(--sans);color:var(--ink);resize:vertical;outline:0}
.form textarea:focus,.form input:focus{box-shadow:0 0 0 2px var(--sel)}
.side{padding:22px;border-radius:24px;background:var(--sf);color:#fff;display:flex;flex-direction:column;gap:10px}
.side b{font:300 italic 30px/1.05 var(--serif)}
.side p{margin:0 0 8px;color:rgba(231,238,250,.7);font-size:14px}
.side .btn-g{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);justify-content:space-between}
@media(max-width:860px){
  .pbar:has(.ptabs) .ttl{display:none}
  .about-top,.peek,.form{grid-template-columns:1fr}
  .cols3,.prices{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr 1fr}
  .prin{grid-template-columns:1fr}
  .edu{grid-template-columns:1fr 1fr}
  .xp button{grid-template-columns:1fr auto}.xp .yr{grid-column:1/-1;order:-1}.xp ul{margin-left:0}
  .pbar{border-radius:22px;flex-wrap:wrap;padding:10px 10px 10px 16px}
  .pfoot{border-radius:22px}
}

/* case page */
.case{position:fixed;inset:0;z-index:120;overflow:auto;background:var(--bg);transform:translateY(102%);transition:transform .8s var(--ease2);visibility:hidden;overscroll-behavior:contain}
.case.open{transform:none;visibility:visible}
.case{overflow-x:hidden}
/* iOS Safari paints the page behind its translucent top bar: hide the page while a case is open */
body:has(.case.open) main,body:has(.case.open) .hd,body:has(.case.open) .mq{visibility:hidden}
@media(max-width:600px){
  .case-bar{gap:10px}
  #caseTitle{display:none}
  .case-bar .btn{height:40px;padding:0 16px;font-size:13px}
  .steps,.case .cs .steps{grid-template-columns:1fr}
  .case .case-hero h1{font-size:clamp(38px,11vw,56px);overflow-wrap:break-word}
  .steps li::before{margin-bottom:14px}
  .life{grid-template-columns:repeat(2,minmax(0,1fr))}
  .life .me .btn{padding:12px 10px;font-size:13px;gap:6px}
  .fx-cur{right:-22px;bottom:-34px}
}
.case-bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 14px) var(--pad) 14px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 1px 0 var(--line)}
.case-bar .prog{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--sel)}
.case-hero{padding:clamp(50px,8vw,100px) 0 40px}
.case-hero .tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.case-hero h1{margin:0;font:300 clamp(56px,10vw,150px)/.9 var(--serif);letter-spacing:-.04em;color:var(--navy)}
.case-hero h1 em{font-style:italic}
.case-hero .lead{font-size:clamp(18px,1.7vw,22px);max-width:34em;margin-top:24px;color:var(--ink)}
.case-hero .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.store{display:inline-flex;align-items:center;gap:12px;padding:10px 18px 10px 14px;border-radius:14px;background:var(--ink);color:var(--bg);text-decoration:none;line-height:1.1}
.store small{display:block;font-size:11px;opacity:.7}
.store b{font-weight:500;font-size:16px}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:44px;padding:22px 0;border-block:1px solid var(--line)}
.meta span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.meta b{font-weight:500}
.case-cov{aspect-ratio:16/8;border-radius:28px;overflow:hidden}
.case-cov .cov{height:100%}
.cs{display:grid;grid-template-columns:.7fr 1.5fr;gap:clamp(24px,5vw,80px);padding:clamp(56px,7vw,96px) 0;border-bottom:1px solid var(--line)}
.cs h2{margin:0;font:300 clamp(32px,3vw,46px)/1.05 var(--serif);letter-spacing:-.02em;color:var(--navy);position:sticky;top:100px;align-self:start}
.cs p{margin:0 0 16px;font-size:18px;max-width:36em}
.cs .ph{color:var(--muted)}
.cs .steps{grid-template-columns:repeat(2,1fr)}
.dec{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dec div{padding:22px;border-radius:20px;box-shadow:inset 0 0 0 1px var(--line)}
.dec b{display:block;font:400 22px/1.15 var(--serif);color:var(--navy);margin-bottom:8px}
.dec span{color:var(--muted);font-size:15px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nums div{padding:22px;border-radius:20px;background:var(--sf);color:#fff}
.nums b{display:block;font:300 54px/1 var(--serif);letter-spacing:-.03em;font-variant-numeric:lining-nums;margin-bottom:14px}
.nums span{color:rgba(231,238,250,.7);font-size:14px}
.redact{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.redact>div{border-radius:20px;overflow:hidden;aspect-ratio:16/10;position:relative}
.redact>div::after{content:'';position:absolute;inset:0;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.case-next{display:block;padding:clamp(70px,10vw,130px) 0;text-align:center;text-decoration:none}
.case-next span{display:block;color:var(--muted);margin-bottom:12px}
.case-next b{font:300 clamp(48px,8vw,120px)/1 var(--serif);letter-spacing:-.04em;color:var(--navy);transition:letter-spacing .7s var(--ease)}
.case-next:hover b{letter-spacing:-.01em;font-style:italic}
@media(max-width:800px){.meta{grid-template-columns:1fr 1fr}.cs{grid-template-columns:1fr}.cs h2{position:relative;top:0}.dec,.nums,.redact{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:400;transform:translate(-50%,20px);opacity:0;padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14px;transition:opacity .3s,transform .5s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.up{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:0 0 0 1px var(--line);opacity:0;transform:translateY(20px);transition:opacity .3s,transform .5s var(--ease)}
.up.show{opacity:1;transform:none}

/* header sizing */
.hd .pill{height:42px;padding:0 18px;font-size:14px}
.hd .btn{height:42px;padding:0 22px}
.hd .lang{height:42px;align-items:center;padding:4px}
.hd .lang button{height:34px;padding:0 12px}
.hd .kbtn{width:42px;height:42px;padding:0;justify-content:center;color:var(--ink)}
.brand b{font-size:28px}
/* popup footer bigger */
.pfoot{padding:10px}
.pfoot .pill{padding:13px 20px;font-size:15px}
/* products block bottom spacing */
.own-next{margin-bottom:0}
.sfb>.wrap{padding-bottom:clamp(50px,7vw,90px)}
/* russian: Georgia for serif text */
html[lang=ru]{--serif:'Cormorant',Georgia,serif}
html[lang=ru] .wm,html[lang=ru] .brand b,html[lang=ru] .intro p,html[lang=ru] .sf-name{font-family:'Newsreader',Georgia,serif}
html[lang=ru] :is(.h-title,.h2,.big,.case-hero h1,.stmt,.cs h2,.peek .info h3,.w-btn,.mq-track span,.case-next b,.w-cap h3,.svc-c h3,.sx-prev h4,.own-next b,.fx-card b){letter-spacing:-.01em}

html[lang=ru] .h-title{font-size:clamp(34px,4.6vw,70px);line-height:.98}
html[lang=ru] .h2{line-height:1}
html[lang=ru] .h2 + .lead,html[lang=ru] .sec-h .lead{margin-top:26px}
html[lang=ru] .case-hero .lead{margin-top:48px}
html[lang=ru] .big{line-height:1}
html[lang=ru] :is(.w-btn,.svc-c h3,.sx-prev h4,.own-next b,.fx-card b,.w-cap h3,.xp .ro,.prin b,.dec b,.edu b,.mvp b,.prices b,.cs h2){line-height:1}
html[lang=ru] :is(.case-hero h1,.peek .info h3,.sf-name){line-height:.88}

/* more work grid */
.mw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mw{display:block;border-radius:22px;overflow:hidden;opacity:0;transform:translateY(18px) scale(.97);transition:opacity .6s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--d) + 250ms)}
.pop.open .mw{opacity:1;transform:none}
.mw img{display:block;width:100%;aspect-ratio:1;object-fit:cover;transition:transform .7s var(--ease)}
.mw:hover img{transform:scale(1.04)}
.lb{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:color-mix(in srgb,#0A1430 70%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:lbIn .35s var(--ease)}
.lb img{max-width:min(92vw,880px);max-height:88vh;border-radius:34px;animation:lbImg .5s var(--ease)}
@keyframes lbIn{from{opacity:0}}
@keyframes lbImg{from{transform:scale(.92);opacity:0}}
@media(max-width:640px){.mw-grid{grid-template-columns:repeat(2,1fr);gap:8px}.mw{border-radius:16px}}

/* about photos */
.photo.img{position:relative;overflow:hidden;padding:0;min-height:320px}
.photo.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.photo.img:hover img{transform:scale(1.04)}
.life .ph-c{position:relative;overflow:hidden;padding:0;background:var(--mist)}
.life .ph-c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

function splitWords(el){
  let i = 0; const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
  while(tw.nextNode()) nodes.push(tw.currentNode);
  nodes.forEach(n => { const f = document.createDocumentFragment();
    n.textContent.split(/(\s+)/).forEach(part => { if(!part) return; if(/^\s+$/.test(part)){ f.append(part); return; }
      const sp = document.createElement('span'); sp.className = 'wd'; sp.style.setProperty('--i', i++); sp.textContent = part; f.append(sp); });
    n.replaceWith(f); });
}

}

async function askElena(q, onText, signal){
  const hist = ASK_HIST.slice(-4);

    try{
      const r = await fetch(AI_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question:q, lang, history:hist}), signal});
      const d = await r.json(); if(d && d.answer){ onText(d.answer); return {text:d.answer, ai:true}; }
    }catch(e){ if(signal && signal.aborted) throw e; }
  }
  if(SAMPLE){
    try{
      const {text} = await SAMPLE(askPrompt(q, hist), {modelTier:'quick', cache:false, signal, onText:({text}) => onText(text)});
      return {text, ai:true};
    }catch(e){ if(e && e.code==='cancelled') throw e; }
  }
  await new Promise(r => setTimeout(r, RM ? 0 : 1300)); if(signal && signal.aborted) throw {code:'cancelled'};
  const la = localAnswer(q); onText(la.text + (la.contact?' [CONTACT]':'')); return {text: la.text + (la.contact?' [CONTACT]':''), ai:false};

function makeSearch(root, opts={}){
  const input = $('input', root), list = $('.sx-list', root), prev = $('.sx-prev', root);
  { const ic = $('.sx-box>svg', root); if(ic){ const o = document.createElement('span'); o.className='orb'; o.setAttribute('aria-hidden','true'); o.innerHTML='<i></i><i></i><i></i><i></i>'; ic.replaceWith(o); }
    const f = document.createElement('span'); f.className='sx-field'; input.replaceWith(f); f.appendChild(input);
    input.addEventListener('input', () => root.classList.toggle('has-val', !!input.value)); }
  let shown = [], idx = 0, chat = null;
  const pop = $('.sx-pop', root);
  function render(){
    if(chat) return;
    pop.classList.remove('chat'); if(input.dataset.ta && /уточняющий|follow-up/.test(input.placeholder)) input.placeholder = t(input.dataset.ta);
    const q = input.value.trim().toLowerCase(), words = q.replace(/[?!.,]/g,'').split(/\s+/).filter(Boolean);
    const hit = q ? INTENTS.find(([re]) => re.test(q)) : null, ans = hit ? T(hit[1]) : null;
    const all = items();
    shown = all.filter(it => { const hay = (it.title+' '+it.sub+' '+it.tags+' '+it.g).toLowerCase(); return !words.length || words.some(w => w.length>2 && hay.includes(w)); });
    if(q && !shown.length && ans) shown = all.filter(it => it.icn);
    if(q && (looksLikeQ(q) || !shown.length)){
      const raw = input.value.trim();
      const askIt = {g: lang==='ru'?'Вопрос мне':'Ask me', title: lang==='ru'?'Спросить Елену':'Ask Elena', sub: '«'+raw+'»', tags:'', icn:'q', ask:true, text: lang==='ru'?'Отвечу от своего имени с помощью AI: по моему опыту, услугам и ценам. Если вопрос сложный, подскажу, как связаться со мной напрямую.':'I’ll answer in my own words with the help of AI, based on my experience, services and prices. If it’s a tricky one, I’ll tell you how to reach me directly.', run:()=>startChat(raw)};
      shown = shown.filter(x=>!x.ask); if(looksLikeQ(q)) shown.unshift(askIt); else shown.push(askIt);
    }
    const score = it => words.reduce((s,w)=>s+(it.title.toLowerCase().includes(w)?3:0)+(it.tags.includes(w)?1:0),0);
    shown.sort((a,b)=>score(b)-score(a));
    const groups = [...new Set(shown.map(s=>s.g))]; shown = groups.flatMap(g=>shown.filter(s=>s.g===g));
    if(looksLikeQ(q)){ const a = shown.findIndex(x=>x.ask); if(a>0){ const [x]=shown.splice(a,1); shown.unshift(x); } }
    idx = clamp(idx, 0, Math.max(0, shown.length-1));
    let h = ans && !looksLikeQ(q) ? `<div class="sx-ans"><i>E</i><p>${ans}</p></div>` : '';
    if(!shown.length){ list.innerHTML = h + `<div class="sx-empty">${t('ans.empty').replace('{q}', input.value.replace(/[<>&]/g,''))}</div>`; prev.innerHTML=''; return; }
    let g = null;
    shown.forEach((it,i) => {
      if(it.g!==g){ g=it.g; h += `<div class="sx-group">${g}</div>`; }
      const icn = it.w ? `<span class="sx-ic" style="background:${it.w.c[0]}">${it.title[0]}</span>` : it.ask ? `<span class="sx-ic q">E</span>` : `<span class="sx-ic g">${it.icn==='p'?'↗':'⚡'}</span>`;
      h += `<button class="sx-item${i===idx?' on':''}${it.ask?' ask':''}" role="option" aria-selected="${i===idx}" data-i="${i}">${icn}<span class="t"><b>${it.title}</b><small>${it.sub}</small></span><span class="ret">Enter</span></button>`;
    });
    list.innerHTML = h; preview();
  }
  function preview(){
    const it = shown[idx]; if(!it){ prev.innerHTML=''; return; }
    $$('.sx-item', list).forEach(b => { const on=+b.dataset.i===idx; b.classList.toggle('on',on); b.setAttribute('aria-selected',on); });
    const on = $('.sx-item.on', list); if(on) on.scrollIntoView({block:'nearest'});
    prev.innerHTML = it.w ? `${cov(it.w,'sm')}<h4>${it.title}</h4><p>${T(it.w.sum)}</p><span class="k">Enter ↵</span>` : `<h4>${it.title}</h4><p>${it.text}</p><span class="k">Enter ↵</span>`;
  }
  const open = () => { root.classList.add('open'); render(); if(opts.fit){ const r=root.getBoundingClientRect(), need=r.bottom+Math.min(420,innerHeight*.6)+24; if(need>innerHeight) scrollBy({top:need-innerHeight,behavior:RM?'auto':'smooth'}); } };
  const run = it => { if(!it) return; if(it.ask){ it.run(); return; } if(opts.onRun) opts.onRun(); else { input.blur(); root.classList.remove('open'); } it.run(); };
  let ctl = null;
  function chatHTML(){
    const ru = lang==='ru';
    return `<div class="sx-chat">${chat.turns.map(tn => tn.role==='user' ? `<div class="sc-q">${escH(tn.content)}</div>` : `<div class="sc-a"><i>E</i><div><p>${tn.content ? fmtAns(tn.content) : `<span class="sc-dots"><b></b><b></b><b></b></span>`}</p>${tn.done ? `<div class="sc-cta${/\[CONTACT\]/.test(tn.content)?' hi':''}"><a class="btn btn-p" href="${TG}" ${ext}>Telegram ${ic.arr}</a><button class="btn btn-g" data-sc="brief">${t('ft.brief')}</button><button class="btn btn-g" data-sc="mail">${t('ft.copy')}</button></div><small class="sc-note">${tn.ai ? (ru?'Ответ AI по моим материалам. Точные детали уточню лично.':'An AI answer based on my materials. I’ll confirm the details personally.') : (ru?'Быстрый ответ по моим материалам. Точные детали уточню лично.':'A quick answer from my materials. I’ll confirm the details personally.')}</small>` : ''}</div></div>`).join('')}<button class="sc-back" data-sc="back">← ${ru?'К результатам поиска':'Back to search results'}</button></div>`;
  }
  function paintChat(){ if(!chat) return; pop.classList.add('chat'); input.placeholder = lang==='ru' ? 'Задайте уточняющий вопрос…' : 'Ask a follow-up…'; list.innerHTML = chatHTML(); prev.innerHTML=''; list.scrollTop = list.scrollHeight; }
  async function startChat(q){
    if(!q) return;
    if(ctl) ctl.abort();
    ctl = new AbortController(); const my = ctl;
    chat = chat || {turns:[]};
    chat.turns.push({role:'user', content:q});
    const a = {role:'assistant', content:'', done:false}; chat.turns.push(a);
    input.value = ''; root.classList.remove('has-val'); root.classList.add('think'); paintChat();
    try{
      const r = await askElena(q, txt => { if(my!==ctl) return; root.classList.remove('think'); a.content = txt; paintChat(); }, my.signal);
      a.content = r.text; a.ai = r.ai;
    }catch(e){ root.classList.remove('think'); if(e && (e.code==='cancelled' || e.name==='AbortError')) return; const la = localAnswer(q); a.content = la.text+' [CONTACT]'; }
    root.classList.remove('think');
    a.done = true; ASK_HIST.push({role:'user',content:q},{role:'assistant',content:a.content.replace(/\[CONTACT\]/g,'').trim()}); paintChat();
  }
  list.addEventListener('click', e => { const b = e.target.closest('[data-sc]'); if(!b) return; const k=b.dataset.sc;
    if(k==='back'){ chat=null; if(ctl) ctl.abort(); root.classList.remove('think'); render(); input.focus(); }
    else if(k==='brief'){ if(opts.onRun) opts.onRun(); else root.classList.remove('open'); openPop('contact'); }
    else if(k==='mail'){ copyMail(); } });
  input.addEventListener('focus', () => { root.classList.add('focus'); open(); });
  input.addEventListener('input', () => { idx=0; if(chat && !input.value.trim()) return; if(chat && !looksLikeQ(input.value.trim())){ chat=null; if(ctl) ctl.abort(); } open(); if(chat) paintChat(); });
  input.addEventListener('blur', () => { root.classList.remove('focus'); setTimeout(()=>{ if(document.activeElement!==input && !opts.keep && !chat) root.classList.remove('open'); },160); });
  input.addEventListener('keydown', e => {
    if(e.key==='ArrowDown'){ e.preventDefault(); idx=(idx+1)%Math.max(1,shown.length); preview(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); idx=(idx-1+shown.length)%Math.max(1,shown.length); preview(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(chat){ startChat(input.value.trim()); return; } run(shown[idx]); }
    else if(e.key==='Escape'){ e.stopPropagation(); if(chat){ chat=null; if(ctl) ctl.abort(); render(); return; } if(opts.onEsc) opts.onEsc(); else { input.value=''; root.classList.remove('open'); input.blur(); } }
  });
  list.addEventListener('mousedown', e => { if(!e.target.closest('a')) e.preventDefault(); });
  if(!opts.keep) document.addEventListener('pointerdown', e => {
    if(!root.classList.contains('open') || root.contains(e.target)) return;
    if(chat){ chat = null; if(ctl) ctl.abort(); root.classList.remove('think'); pop.classList.remove('chat'); input.placeholder = t(input.dataset.ta); }
    root.classList.remove('open'); input.blur();
  });
  list.addEventListener('mousemove', e => { const b=e.target.closest('.sx-item'); if(b && +b.dataset.i!==idx){ idx=+b.dataset.i; preview(); } });
  list.addEventListener('click', e => { const b=e.target.closest('.sx-item'); if(b) run(shown[+b.dataset.i]); });
  const gb = $('.sx-go', root); if(gb) gb.addEventListener('click', () => { input.focus(); if(chat && input.value.trim()){ startChat(input.value.trim()); return; } if(input.value) run(shown[idx]); });
  return {input, set(q){ input.value=q; idx=0; input.focus(); open(); }, render};
}

(()=>{ let d=null;
 const sync = el => { const max=el.scrollWidth-el.clientWidth; el.classList.toggle('end', el.scrollLeft>=max-4);
   const dots=el.parentElement.querySelectorAll('.peek-dots i'); if(!dots.length) return;
   const n=Math.round(el.scrollLeft/Math.max(1,max)*(dots.length-1)); dots.forEach((x,i)=>x.classList.toggle('on',i===n)); };
 document.addEventListener('scroll', e => { if(e.target.classList && e.target.classList.contains('peek-ph')) sync(e.target); }, true);
 document.addEventListener('pointerdown', e => { const el=e.target.closest && e.target.closest('.peek-ph'); if(!el||e.pointerType!=='mouse') return; d={el,x:e.clientX,s:el.scrollLeft,m:false}; });
 document.addEventListener('pointermove', e => { if(!d) return; const dx=e.clientX-d.x; if(Math.abs(dx)>3){ d.m=true; d.el.classList.add('drag'); } d.el.scrollLeft=d.s-dx; });
 document.addEventListener('pointerup', () => { if(!d) return; const el=d.el; d=null; el.classList.remove('drag'); });
})();
function openPop(kind, arg){
  if(caseEl.classList.contains('open') && kind!=='contact') closeCase();
  closePal();
  popKind = kind; popArg = arg;
  if(!pop.classList.contains('open')) lastFocus = document.activeElement;
  const wasOpen = pop.classList.contains('open');
  stack.innerHTML = POP[kind](arg);
  pop.scrollTop = 0;
  if(wasOpen){ $$('.pk',stack).forEach(p => { p.style.transition='none'; }); requestAnimationFrame(()=>$$('.pk',stack).forEach(p=>p.style.transition='')); }
  pop.classList.remove('closing'); pop.classList.add('open'); pop.setAttribute('aria-hidden','false'); document.body.classList.add('lock');
  setTimeout(()=>{ const x=$('.x',stack); if(x) x.focus({preventScroll:true}); }, 80);
}
function closePop(){
  if(!pop.classList.contains('open')) return;
  pop.classList.add('closing'); pop.classList.remove('open'); pop.setAttribute('aria-hidden','true');
  if(!caseEl.classList.contains('open')) document.body.classList.remove('lock');
  popKind = null; if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
}
const openPeek = id => openPop('peek', id);
pop.addEventListener('click', e => {
  const zb = e.target.closest('.lb'); if(zb){ zb.remove(); return; }
  const pz = e.target.closest('[data-pzoom]'); if(pz){ const [pid,pi]=pz.dataset.pzoom.split(':'); const lb=document.createElement('div'); lb.className='lb'; lb.innerHTML=`<img src="${PI[pid].pins[+pi]}" alt="" style="border-radius:18px;max-width:min(94vw,1400px);max-height:90vh">`; pop.appendChild(lb); return; }
  const kz = e.target.closest('[data-kzoom]'); if(kz){ const lb=document.createElement('div'); lb.className='lb'; lb.innerHTML=`<img src="${KL[kz.dataset.kzoom]}" alt="" style="border-radius:18px">`; pop.appendChild(lb); return; }
  const z = e.target.closest('[data-zoom]'); if(z){ const lb=document.createElement('div'); lb.className='lb'; lb.innerHTML=`<img src="${MORE_IMG[+z.dataset.zoom]}" alt="">`; pop.appendChild(lb); return; }
  if(e.target.closest('[data-popclose]')){ closePop(); return; }
  const tb = e.target.closest('[data-ptab]'); if(tb){ openPop(tb.dataset.ptab); return; }
  const xb = e.target.closest('.xp > li > button'); if(xb){ const li=xb.parentElement, o=!li.classList.contains('open'); li.classList.toggle('open',o); xb.setAttribute('aria-expanded',o); return; }
  const op = e.target.closest('.opts button'); if(op){ const g=op.parentElement; $$('button',g).forEach(b=>b.setAttribute('aria-pressed', b===op)); return; }
  if(e.target.closest('[data-openpal]')){ closePop(); openPal(); }
});

  const stamp = (x, y, f) => { const gx = Math.floor(x/S), gy = Math.floor(y/S), R = 2;
    for(let i=-R;i<=R;i++) for(let j=-R;j<=R;j++){ const d = Math.hypot(i,j); if(d > R+.2 || Math.random() > (1-d/(R+1))*f) continue;
      const k = (gx+i)+','+(gy+j), l = .55+Math.random()*.45, c = cells.get(k);
      if(c) c.l = Math.max(c.l, l); else cells.set(k, {x:gx+i, y:gy+j, l, c:PAL[Math.random()*PAL.length|0], p:Math.random()<.16}); } };
  const draw = () => { const oy = opt.fixed ? scrollY : 0; g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
    for(const [k,c] of cells){ c.l -= .016; if(c.l <= 0){ cells.delete(k); continue; }
      const a = Math.min(1, c.l*1.4), cx0 = c.x*S + S/2, cy0 = c.y*S + S/2 - oy; if(cy0 < -S || cy0 > H+S) continue;
      g.globalAlpha = c.l*opt.alpha; g.fillStyle = g.strokeStyle = c.c;
      if(c.p){ const h = 4*a; g.lineWidth = 1.5; g.beginPath(); g.moveTo(cx0-h,cy0); g.lineTo(cx0+h,cy0); g.moveTo(cx0,cy0-h); g.lineTo(cx0,cy0+h); g.stroke(); }
      else { const s = (S-5)*a; g.fillRect(cx0-s/2, cy0-s/2, s, s); } }
    raf = cells.size ? requestAnimationFrame(draw) : 0; };
  host.addEventListener('pointermove', e => { if(opt.skip && opt.skip(e)){ last = null; return; }
    let x = e.clientX, y = e.clientY;
    if(opt.fixed) y += scrollY; else { const r = host.getBoundingClientRect(); x -= r.left; y -= r.top; }
    if(last){ const dist = Math.hypot(x-last.x, y-last.y), n = Math.min(8, Math.ceil(dist/S)), f = Math.min(.9, .25+dist/60);
      if(dist < 200) for(let k=1;k<=n;k++) stamp(last.x+(x-last.x)*k/n, last.y+(y-last.y)*k/n, f); }
    last = {x, y}; if(!raf && cells.size) raf = requestAnimationFrame(draw); }, {passive:true});
  host.addEventListener('pointerleave', () => last = null);
}
if(FINE && !RM){
  const hero = $('.hero'), hc = document.createElement('canvas'); hc.className = 'h-px'; hc.setAttribute('aria-hidden','true');
  $('.h-aura', hero).after(hc);
  pixelTrail(hc, hero, {alpha:.42, skip:e => e.target.closest('.sx-pop')});
  const pc = document.createElement('canvas'); pc.className = 'px-all'; pc.setAttribute('aria-hidden','true'); document.body.prepend(pc);
  pixelTrail(pc, document, {fixed:true, alpha:.3, skip:e => e.target.closest('.hero,.pop,.case,.sfb,.intro') || document.body.classList.contains('lock')});
}
/* magnetic buttons */
if(FINE && !RM){
  let mg = null;
  document.addEventListener('pointermove', e => { const b = e.target.closest('.btn');
    if(mg && mg !== b){ mg.style.transform = ''; mg = null; }
    if(!b) return; mg = b; const r = b.getBoundingClientRect(), dx = e.clientX-(r.left+r.width/2), dy = e.clientY-(r.top+r.height/2);

/* marquee */
let mx=0, vel=0, lastY=scrollY; const mq=$('#mq');
(function loop(){ const dy=scrollY-lastY; lastY=scrollY; vel+=(Math.abs(dy)*.06-vel)*.1; mx-=(RM?0:.45+vel); const w=mq.scrollWidth/3; if(w && -mx>w) mx+=w; mq.style.transform=`translateX(${mx}px)`; requestAnimationFrame(loop); })();

/* wordmark with inline photo */
const wm = $('#wm');
function renderWM(){ wm.innerHTML = [...'Design'].map(c=>`<span>${c}</span>`).join('') + `<span class="face" data-cur="view"><img src="${ABOUT_IMG.face}" alt="Elena" loading="lazy" decoding="async"></span>` + [...'by'].map(c=>`<span class="it">${c}</span>`).join('') + '<span class="sp"></span>' + [...'Elena'].map(c=>`<span class="it">${c}</span>`).join('');
$$('span', wm).forEach((s,i)=>s.style.transitionDelay = `0s, ${i*.04}s, ${i*.04}s`); }
renderWM();
if(FINE && !RM){
  wm.addEventListener('mousemove', e => $$('span:not(.sp):not(.face):not(small)', wm).forEach(s => { const r=s.getBoundingClientRect(), d=Math.abs(e.clientX-(r.left+r.width/2)); s.style.setProperty('--w', Math.round(220+560*Math.max(0,1-d/260))); }));
  wm.addEventListener('mouseleave', () => $$('span:not(.sp):not(.face)', wm).forEach(s => s.style.setProperty('--w', 260)));
}

/* reveals */
const rvIO = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); rvIO.unobserve(e.target); } }), {rootMargin:'0px 0px -10% 0px'});

/* figma multiplayer cursor */
const fc = $('#fcur');
function curLabel(el){ const k = el ? el.dataset.cur : null; if(k) $('span',fc).textContent = t('cur.'+k); fc.classList.toggle('act', !!k); }
if(FINE){
  document.documentElement.classList.add('fc');
  addEventListener('pointermove', e => { fc.style.transform = `translate(${e.clientX-2}px,${e.clientY-2}px)`; fc.classList.toggle('on', !e.target.closest('input,textarea')); }, {passive:true});
  document.addEventListener('pointerleave', () => fc.classList.remove('on'));
  addEventListener('pointerdown', () => fc.classList.add('down')); addEventListener('pointerup', () => fc.classList.remove('down'));
  document.addEventListener('pointerover', e => curLabel(e.target.closest('[data-cur]')));
}

/* boot */
renderAll(); sfLoop(); seoMeta();
setTimeout(() => $$('.rv, .wm').forEach(el => rvIO.observe(el)), 50);
let typeT;
function animTxt(slot, txt){
  const old = slot.querySelector('.cur');
  if(old){ old.className='out'; [...old.children].forEach((c,k)=>c.style.animationDelay=(k*7)+'ms'); setTimeout(()=>old.remove(), 420+old.children.length*7); }
  if(!txt) return;
  const n = document.createElement('span'); n.className='cur';
  n.innerHTML = [...txt].map((ch,k)=>`<i style="animation-delay:${(old?140:0)+k*24}ms">${ch===' '?' ':escH(ch)}</i>`).join('');
  slot.appendChild(n);
}
function typeLoop(){
  const inp = hero.input, root = $('#sxHero'), field = inp.parentElement;
  const ov = document.createElement('span'); ov.className='ph-anim'; ov.setAttribute('aria-hidden','true');
  ov.innerHTML = '<span class="pre"></span><span class="slot"></span>'; field.appendChild(ov);
  const pre = $('.pre',ov), slot = $('.slot',ov); let p = 0, lastA = null, lastB = null, lastLang = lang;
  const show = (a,b) => { ov.style.font = getComputedStyle(inp).font; ov.style.lineHeight = '1.5'; if(a!==lastA){ lastA=a; animTxt(pre,a); } if(b!==lastB){ lastB=b; animTxt(slot,b); } };
  const step = () => {
    root.classList.toggle('has-val', !!inp.value);
    if(lang!==lastLang){ lastLang=lang; p=0; }
    if(inp.value){ typeT=setTimeout(step,400); return; }
    if(document.activeElement===inp || root.classList.contains('open')){ show('', inp.placeholder || t('hero.ask')); typeT=setTimeout(step,300); return; }
    const L = PH[lang];
    if(RM){ show(t('hero.try'), L[0]); typeT=setTimeout(step,1000); return; }
    show(t('hero.try'), L[p % L.length]); p++; typeT=setTimeout(step,3000);
  };
  setTimeout(step, 1500);
}
const intro = $('#intro');
const start = () => { document.body.classList.add('ready'); typeLoop(); };
let seen = false; try{ seen = sessionStorage.getItem('introSeen')==='1'; sessionStorage.setItem('introSeen','1'); }catch(e){}
/* deep links from the 404 page and shared links: /#case-klaris opens that case */
const deepCase = () => { const m = location.hash.match(/^#case-([\w-]+)$/); return m && BY[m[1]] ? m[1] : null; };
const openDeep = () => { const id = deepCase(); if(!id) return; history.replaceState(null, '', location.pathname + location.search); openPeek(id); };
if(deepCase()){ seen = true; setTimeout(openDeep, RM ? 0 : 700); }
addEventListener('hashchange', openDeep);
if(RM){ intro.remove(); start(); }
else if(seen){ intro.classList.add('clear'); $('#iPill').style.opacity=0; setTimeout(()=>intro.remove(), 900); start(); }
else runIntro();
function runIntro(){
  const cv = $('#introCv'), ctx = cv.getContext('2d'), pill = $('#iPill'), q = $('.i-q',pill), cap = $('#iCap');
  let W, H, D;
  const fit = () => { D = Math.min(2, devicePixelRatio||1); W = innerWidth; H = innerHeight; cv.width = W*D; cv.height = H*D; ctx.setTransform(D,0,0,D,0,0); };
  fit(); addEventListener('resize', fit);
  const P = Object.values(PI);
  const srcs = [...P.map(x=>x.cover), ...P.map(x=>x.pins[1]), KL.tasks, KL.dark, KL.mobile, KL.signal, KL.profile, UN.mood, UN.trips, UN.budget, UN.profile, UN.hero, ...MORE_IMG.slice(0,12)].filter(Boolean).slice(0,40);
  const tiles = []; let loaded = 0; const total = srcs.length;
  const capTxt = () => cap.textContent = `${lang==='ru'?'Собираю портфолио':'Gathering the portfolio'} · ${String(loaded).padStart(2,'0')} / ${total}`;
  capTxt();
  srcs.forEach((src,i) => { const im = new Image(); im.decoding = 'async'; im.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 112; const g = c.getContext('2d'), m = Math.min(im.width, im.height);
      g.beginPath(); g.arc(56,56,56,0,7); g.clip(); g.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,112,112);
      tiles[i] = c; loaded++; capTxt(); }; im.src = window.SITE_THUMBS ? src.replace('/assets/img/', '/assets/thumb/') : src; });
  const small = W < 700, N = small ? 30 : 46, ZF = 6.2, ZN = .22;
  const items = Array.from({length:N}, (_,k) => ({ph:k/N, t:(k*7) % total}));
  const COLS = ['110,162,255','185,174,255','255,201,174','159,194,255'];
  let travel = 0, last = performance.now(), t0 = last, speed = .045, warp = 0, alive = true;
  const ease = x => 1 - Math.pow(1-x, 3);
  function frame(now){
    if(!alive) return;
    const dt = Math.min(.05, (now-last)/1000); last = now; const el = (now-t0)/1000;
    const sp = speed + warp*warp*1.6; travel += dt*sp;
    ctx.clearRect(0,0,W,H);
    const cx = W/2, cy = H/2, M = Math.min(W,H), R = M*(small?.2:.17)*ease(Math.min(1, el/1.1)), base = M*(small?.07:.052);
    const list = items.map(it => { const f = (it.ph + travel) % 1; return {it, Z: ZF - f*(ZF-ZN)}; }).sort((a,b) => b.Z - a.Z);
    for(const {it,Z} of list){
      const th = Z*2.55 + el*.55 + warp*warp*2, x = cx + Math.cos(th)*R*3/Z, y = cy + Math.sin(th)*R*2.6/Z, sz = base*1.4/Z;
      const fadeIn = Math.min(1, (ZF - Z)/1.2), tile = tiles[it.t];
      if(x < -sz*3 || x > W+sz*3 || y < -sz*3 || y > H+sz*3) continue;
      const near = Math.max(0, (1.25 - Z)/1.25) + warp*.6;
      if(near > .02){
        const ang = Math.atan2(y-cy, x-cx), len = sz*(1.2 + near*3.2 + warp*4), col = COLS[it.t % COLS.length], nn = Math.min(1,near);
        ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
        const gr = ctx.createLinearGradient(-len,0,sz*.5,0);
        gr.addColorStop(0,`rgba(${col},0)`); gr.addColorStop(.55,`rgba(${col},${.55*nn*fadeIn})`); gr.addColorStop(1,`rgba(255,255,255,${.7*nn*fadeIn})`);
        ctx.fillStyle = gr; ctx.shadowColor = `rgba(${col},.8)`; ctx.shadowBlur = 24*nn;
        ctx.beginPath(); ctx.ellipse(-len*.35, 0, len*.65+sz*.3, sz*.42, 0, 0, 7); ctx.fill(); ctx.restore();
      }
      ctx.globalAlpha = fadeIn * Math.max(0, 1 - Math.max(0,near-.15)*1.1);
      if(tile) ctx.drawImage(tile, x-sz/2, y-sz/2, sz, sz);
      else { ctx.fillStyle = 'rgba(110,162,255,.25)'; ctx.beginPath(); ctx.arc(x,y,sz/2,0,7); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(t => { intro.classList.add('on'); last = t; t0 = t; requestAnimationFrame(frame); });
  const word = 'Design by Elena'; let wi = 0;
  const addCh = () => { const i = document.createElement('i'); const ch = word[wi++]; i.textContent = ch===' ' ? ' ' : ch; q.appendChild(i); };
  let typeT = setTimeout(function tp(){ if(wi < word.length){ addCh(); typeT = setTimeout(tp, 62 + Math.random()*40); } }, 450);
  let done = false;
  const go = () => {
    if(done) return; done = true; clearTimeout(typeT); while(wi < word.length) addCh();
    pill.classList.add('think','go');
    setTimeout(() => {
      pill.classList.remove('go'); q.classList.add('out');
      const t1 = performance.now(); (function ramp(n){ warp = Math.min(1, Math.max(0,(n-t1)/700)); if(warp<1 && alive) requestAnimationFrame(ramp); })(t1);
      document.body.classList.add('pill-flying'); start();
      setTimeout(() => intro.classList.add('clear','fade'), 120);
      const box = $('#sxHero .sx-box'), r0 = pill.getBoundingClientRect(), r1 = box && box.getBoundingClientRect();
      const finish = () => { alive = false; document.body.classList.remove('pill-flying'); const h = $('#sxHero'); h.style.transition = 'none'; requestAnimationFrame(()=>requestAnimationFrame(()=>{ h.style.transition=''; })); intro.remove(); };
      Object.assign(pill.style, {left:r0.left+'px', top:r0.top+'px', width:r0.width+'px', height:r0.height+'px', transform:'none'});
      if(r1 && r1.top > 0 && r1.bottom < innerHeight){
        pill.classList.remove('think');
        const an = pill.animate([{left:r0.left+'px',top:r0.top+'px',width:r0.width+'px',height:r0.height+'px'},{left:r1.left+'px',top:r1.top+'px',width:r1.width+'px',height:r1.height+'px'}], {duration:850, easing:'cubic-bezier(.65,0,.2,1)', fill:'forwards'});
        an.onfinish = finish;
      } else { pill.animate([{opacity:1},{opacity:0}], {duration:400, fill:'forwards'}).onfinish = finish; }
    }, 520);
  };
  setTimeout(go, 450 + word.length*82 + 650);
  intro.addEventListener('click', go);
}


})();
